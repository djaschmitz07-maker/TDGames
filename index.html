<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD Gaming</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px 60px;
        }

        /* Rectangular Top Banner */
        .top-banner {
            width: 100%;
            max-width: 900px;
            background-color: #1d4ed8;
            color: #ffffff;
            padding: 20px 28px;
            border-radius: 6px;
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.18);
        }

        .top-banner h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        /* Responsive Grid for Game Squares */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        /* Minimalist Clickable Square */
        .game-square {
            aspect-ratio: 1 / 1; /* Keeps the cards perfectly square */
            background-color: #ffffff;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: #111111;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
            padding: 16px;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .game-icon {
            font-size: 2.25rem;
            line-height: 1;
        }

        .game-tag {
            font-size: 0.75rem;
            color: #777777;
            font-weight: 400;
        }

        /* Subtle Hover & Active Effects */
        .game-square:hover {
            border-color: #111111;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .game-square:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px 40px;
            }
            .top-banner {
                padding: 16px 20px;
                margin-bottom: 24px;
            }
            .top-banner h1 {
                font-size: 1.5rem;
            }
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <header class="top-banner">
        <h1>TD Gaming</h1>
    </header>

    <main class="game-grid" id="gameGrid">
        <a href="https://djaschmitz07-maker.github.io/Rocket-Asteroid-Dodger/" target="_blank" rel="noopener noreferrer" class="game-square">
            <span class="game-icon">🚀</span>
            <span>Rocket Asteroid Dodger</span>
            <span class="game-tag">Arcade</span>
        </a>
    </main>

</body>
</html>
