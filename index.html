<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD Gaming</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e5e7eb;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px 60px;
        }

        /* Rectangular Top Banner */
        .top-banner {
            width: 100%;
            max-width: 900px;
            background-color: #1d4ed8;
            color: #ffffff;
            padding: 20px 28px;
            border-radius: 6px;
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.18);
        }

        .top-banner h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        /* Responsive Grid for Game Squares */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        /* Minimalist Clickable Square */
        .game-square {
            aspect-ratio: 1 / 1; /* Keeps the cards perfectly square */
            background-color: #ffffff;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: #111111;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
            padding: 16px;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .game-icon {
            font-size: 2.25rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-tag {
            font-size: 0.75rem;
            color: #777777;
            font-weight: 400;
        }

        /* Subtle Hover & Active Effects */
        .game-square:hover {
            border-color: #111111;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .game-square:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 16px 40px;
            }
            .top-banner {
                padding: 16px 20px;
                margin-bottom: 24px;
            }
            .top-banner h1 {
                font-size: 1.5rem;
            }
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <header class="top-banner">
        <h1>TD Gaming</h1>
    </header>

    <main class="game-grid" id="gameGrid">
        <a href="https://djaschmitz07-maker.github.io/Rocket-Asteroid-Dodger/" target="_blank" rel="noopener noreferrer" class="game-square">
            <span class="game-icon">🚀</span>
            <span>Rocket Asteroid Dodger (Original)</span>
            <span class="game-tag">Original</span>
        </a>

        <a href="https://djaschmitz07-maker.github.io/Rocket-Asteroid-Dodger2.0/" target="_blank" rel="noopener noreferrer" class="game-square">
            <span class="game-icon">🚀</span>
            <span>Rocket Asteroid Dodger 2.0</span>
            <span class="game-tag">Arcade</span>
        </a>

        <a href="https://djaschmitz07-maker.github.io/Rocket-Galaga/" target="_blank" rel="noopener noreferrer" class="game-square">
            <span class="game-icon" aria-hidden="true">
                <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Twin Wing Laser Tips -->
                    <rect x="8" y="28" width="4" height="10" rx="2" fill="#ef4444"/>
                    <rect x="52" y="28" width="4" height="10" rx="2" fill="#ef4444"/>
                    <!-- Swept Wings -->
                    <path d="M24 28L8 44V50L24 44V28Z" fill="#2563eb"/>
                    <path d="M40 28L56 44V50L40 44V28Z" fill="#2563eb"/>
                    <!-- Main Starfighter Hull -->
                    <path d="M32 6C26 14 23 26 23 44H41C41 26 38 14 32 6Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round"/>
                    <!-- Nose Cone Accent -->
                    <path d="M32 6C29.5 9.5 27.8 14 26.8 18H37.2C36.2 14 34.5 9.5 32 6Z" fill="#ef4444"/>
                    <!-- Cockpit Canopy -->
                    <ellipse cx="32" cy="27" rx="3.5" ry="6.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
                    <!-- Twin Thruster Flames -->
                    <path d="M26 44L28 56L30 44H26Z" fill="#f97316"/>
                    <path d="M34 44L36 56L38 44H34Z" fill="#f97316"/>
                </svg>
            </span>
            <span>Galactic Rocket Defender</span>
            <span class="game-tag">Arcade</span>
        </a>
    </main>

</body>
</html>
